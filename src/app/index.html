<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'" />
    <title>Jarvis</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      /* The whole window drags, since it has no title bar. */
      body { -webkit-app-region: drag; display: flex; flex-direction: column; align-items: center; font: 12px -apple-system, system-ui, sans-serif; }
      canvas { width: 240px; height: 240px; }
      #caption { color: #cfefff; text-shadow: 0 0 6px #000, 0 0 2px #000; text-align: center; padding: 0 8px; max-height: 36px; overflow: hidden; }
    </style>
  </head>
  <body>
    <canvas id="orb" role="img" aria-label="Jarvis"></canvas>
    <div id="caption" role="status" aria-live="polite">Starting…</div>
    <script src="renderer.js"></script>
  </body>
</html>
